# scripts/check.conf — PolsanIzin (.NET 10). Format: scripts/check.conf.example.
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME only.
#
# GREENFIELD: the repo has no solution yet ("No spec, no code" — the skeleton is the first spec).
# Until then check is a no-op. The PLANNED steps are below, commented out; the first feature
# (solution skeleton: PolsanIzin.slnx, global.json, Directory.Build.props) uncomments them,
# then reruns ./scripts/residue and ./scripts/residue --fast and the test-count comparison.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what dotnet can leave running:
#   - MSBuild worker nodes (node reuse)        -> -nodeReuse:false + MSBUILDDISABLENODEREUSE=1
#   - MSBuild server (dotnet CLI)              -> DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
#   - Roslyn compiler server (VBCSCompiler)    -> -p:UseSharedCompilation=false
#   - Razor compiler server (rzc)              -> -p:UseRazorBuildServer=false
#   - test hosts (testhost)                    -> exit with the run; app-under-test is in-process
#                                                 (WebApplicationFactory, disposed by the fixture)
# Fast/full split by a SELECTOR (docs/testing.md, rule 4): trait Kategori — fast runs
# Kategori!=Entegrasyon, full-only runs Kategori=Entegrasyon; untagged tests land in fast.
#
# resource hygiene: no MSBuild nodes, no MSBuild server, no shared compiler / Razor build server
# build [fast]: DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1 MSBUILDDISABLENODEREUSE=1 dotnet build PolsanIzin.slnx -c Release -nodeReuse:false -p:UseSharedCompilation=false -p:UseRazorBuildServer=false
# test-birim [fast]: DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1 MSBUILDDISABLENODEREUSE=1 dotnet test PolsanIzin.slnx -c Release --no-build -nodeReuse:false --filter "Kategori!=Entegrasyon"
# format: DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1 MSBUILDDISABLENODEREUSE=1 dotnet format PolsanIzin.slnx --verify-no-changes --no-restore
# test-entegrasyon: DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1 MSBUILDDISABLENODEREUSE=1 dotnet test PolsanIzin.slnx -c Release --no-build -nodeReuse:false --filter "Kategori=Entegrasyon"
